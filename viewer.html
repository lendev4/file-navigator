<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>File Navigator</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="viewer.css">
  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/purify.min.js"></script>
  <!-- Order matters: viewer.js tells content.js which file this page shows. -->
  <script src="shared.js"></script>
  <script src="viewer.js"></script>
  <script src="content.js"></script>
</head>
<!-- For text, the <pre> comes first so the page looks like Chrome's own text
     view, which content.js treats the same way. -->
<body>
  <pre id="fn-text"></pre>
  <div id="fn-view-switch" hidden>
    <button type="button" data-view="rendered"></button>
    <button type="button" data-view="source">Source</button>
  </div>
  <div id="fn-rendered" hidden></div>
</body>
</html>
