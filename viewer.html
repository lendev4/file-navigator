<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>File Navigator</title>
  <link rel="icon" href="icons/icon32.png">
  <!-- Order matters: viewer.js tells content.js which file this page shows. -->
  <script src="viewer.js"></script>
  <script src="shared.js"></script>
  <script src="content.js"></script>
</head>
<!-- Looks like Chrome's own text view, so content.js treats it the same. -->
<!-- Extension pages default to a smaller font size than normal pages, so set Chrome's 13px. -->
<body><pre id="text" style="word-wrap: break-word; white-space: pre-wrap; font-size: 13px;"></pre></body>
</html>
